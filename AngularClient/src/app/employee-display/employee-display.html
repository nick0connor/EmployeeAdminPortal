<section class="Employee">
    <div style="border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        padding: 16px;
        background-color: #fff;"
    >
        <a [routerLink]="['/details', employeeObject().id]">
            <h2>Name: {{ employeeObject().name }}</h2>
            <p>Email: {{ employeeObject().email }}</p>
            <p>Salary: ${{ employeeObject().salary }}</p>
        </a>
    </div>
</section>
